name: Deploy Docs Web to CogitoVM

on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to CogitoVM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.COGITOVM_HOST }}
          username: ${{ secrets.COGITOVM_USER }}
          key: ${{ secrets.COGITOVM_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,vinylkit.caddy,requirements.txt,pyproject.toml,README.md,src,docs"
          target: "/srv/apps/vinylkit-docs"

      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.COGITOVM_HOST }}
          username: ${{ secrets.COGITOVM_USER }}
          key: ${{ secrets.COGITOVM_SSH_KEY }}
          script: |
            sudo cp /srv/apps/vinylkit-docs/vinylkit.caddy /srv/apps/caddy/conf.d/vinylkit.caddy
            cd /srv/apps/vinylkit-docs && sudo docker compose up -d --build
            sudo docker exec caddy_gateway caddy reload --config /etc/caddy/Caddyfile
